on:
  push:
    branches: [ main ]
  pull_request:
jobs:
  build-debug:
    name: Build Debug
    runs-on: windows-2025

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: microsoft/setup-msbuild@v2

      - name: Build
        run: >
          msbuild DesktopCreature.sln
          /m
          /p:Configuration=Debug
          /p:Platform=x64

  build-release:
    name: Build Release
    runs-on: windows-2025

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: microsoft/setup-msbuild@v2

      - name: Build
        run: >
          msbuild DesktopCreature.sln
          /m
          /p:Configuration=Release
          /p:Platform=x64
