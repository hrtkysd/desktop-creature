name: CodeQL

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: CodeQL
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Restore NuGet packages
        run: >
          msbuild Creature.sln
          /t:Restore
          /p:RestorePackagesConfig=true

      - name: Build ImGui
        run: >
          msbuild third_party\ImGuiWrapper\ImGuiWrapper.vcxproj
          /m
          /p:Configuration=Release
          /p:Platform=x64
          /p:RunCodeAnalysis=false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: c-cpp
          build-mode: manual

      - name: Build
        run: >
          msbuild Creature.sln
          /m
          /t:Build
          /p:Configuration=Release
          /p:Platform=x64
          /p:RunCodeAnalysis=false

      - name: Analyze
        uses: github/codeql-action/analyze@v4